
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Walking Bar - 線上訂位預約</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { background-color: #0d0e12; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(22, 25, 35, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-choice { border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(30, 35, 50, 0.6); transition: all 0.2s; }
        .btn-choice.active { background: #f97316; border-color: #f97316; color: white; box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body class="min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto glass rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 via-orange-500 to-red-500"></div>
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wide text-orange-500 mb-1">Swag Walking Bar</h1>
            <p class="text-xs text-gray-400"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> 高雄市鳳山區中山西路46號</p>
            <p class="text-xs text-orange-400 mt-1"><i class="fas fa-subway mr-1"></i> 捷運鳳山站 2 號出口</p>
        </div>
        <form id="bookingForm" onsubmit="submitBooking(event)">
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-300 mb-2">1. 選擇人數</label>
                <select id="guests" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                    <option value="1">1 人</option><option value="2" selected>2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option>
                </select>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-300 mb-2">2. 選擇日期</label>
                <input type="date" id="date" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-300 mb-2">3. 選擇區域</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setArea('1樓吧台區')" id="area-bar" class="btn-choice rounded-xl py-3 text-center active"><i class="fas fa-glass-martini-alt mb-1 block text-lg"></i> 1樓吧台區</button>
                    <button type="button" onclick="setArea('2樓露營區')" id="area-camp" class="btn-choice rounded-xl py-3 text-center"><i class="fas fa-campground mb-1 block text-lg"></i> 2樓露營區</button>
                </div>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-300 mb-2">4. 選擇時間</label>
                <div class="grid grid-cols-4 gap-2 mb-3">
                    <button type="button" onclick="setTime('18:00')" class="time-btn btn-choice rounded-lg py-2 text-sm">18:00</button>
                    <button type="button" onclick="setTime('19:00')" class="time-btn btn-choice rounded-lg py-2 text-sm">19:00</button>
                    <button type="button" onclick="setTime('20:00')" class="time-btn btn-choice rounded-lg py-2 text-sm">20:00</button>
                    <button type="button" onclick="setTime('21:00')" class="time-btn btn-choice rounded-lg py-2 text-sm">21:00</button>
                </div>
                <button type="button" onclick="toggleCustomTime()" class="text-xs text-orange-400 hover:text-orange-300 transition"><i class="far fa-clock mr-1"></i> 自行填寫其他時間</button>
                <input type="time" id="customTime" class="hidden w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 mt-2 text-white focus:outline-none focus:border-orange-500">
            </div>
            <div class="border-t border-slate-800 my-5 pt-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">顧客姓名</label>
                    <input type="text" id="name" required placeholder="請輸入您的姓名" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">電話號碼</label>
                    <input type="tel" id="phone" required placeholder="請輸入聯絡電話" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">備註說明 (選填)</label>
                    <textarea id="notes" placeholder="如有過敏原或特殊需求請註明" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500"></textarea>
                </div>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl py-4 font-bold text-lg hover:from-orange-600 hover:to-amber-600 transition transform active:scale-95 shadow-lg shadow-orange-500/20">確認預約訂位</button>
        </form>
    </div>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBDo8F-FeoSnY-DOA3YemmahvPmcVnoxGY",
          authDomain: "://firebaseapp.com",
          databaseURL: "https://firebaseio.com",
          projectId: "swag-walking-bar",
          storageBucket: "swag-walking-bar.firebasestorage.app",
          messagingSenderId: "667221676731",
          appId: "1:667221676731:web:28201b76875fe9c79b8f9e"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let selectedArea = '1樓吧台區';
        let selectedTime = '';

        document.getElementById('date').min = new Date().toISOString().split('T')[0];

        function setArea(area) {
            selectedArea = area;
            document.getElementById('area-bar').classList.toggle('active', area === '1樓吧台區');
            document.getElementById('area-camp').classList.toggle('active', area === '2樓露營區');
        }

        function setTime(time) {
            selectedTime = time;
            document.getElementById('customTime').classList.add('hidden');
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === time);
            });
        }

        function toggleCustomTime() {
            selectedTime = '';
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            const customInput = document.getElementById('customTime');
            customInput.classList.remove('hidden');
            customInput.focus();
        }

        function submitBooking(e) {
            e.preventDefault();
            const finalTime = selectedTime || document.getElementById('customTime').value;
            if(!finalTime) { alert('請選擇或填寫訂位時間！'); return; }

            const bookingData = {
                guests: document.getElementById('guests').value,
                date: document.getElementById('date').value,
                area: selectedArea,
                time: finalTime,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                notes: document.getElementById('notes').value,
                createdAt: new Date().toISOString()
            };

            database.ref('bookings').push(bookingData)
                .then(() => {
                    alert('🎉 預約成功！期待您的光臨！');
                    document.getElementById('bookingForm').reset();
                    setTime('');
                })
                .catch((error) => { alert('系統忙碌中：' + error.message); });
        }
    </script>
</body>
</html>
