<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Walking Bar - 線上訂位預約</title>
    <style>
        body { background-color: #0d0e12; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px 16px; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; background: #161923; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); box-sizing: border-box; position: relative; }
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #f59e0b, #f97316, #ef4444); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { color: #f97316; font-size: 24px; margin: 0 0 6px 0; font-weight: bold; }
        .header p { color: #94a3b8; font-size: 13px; margin: 4px 0; }
        .header .subway { color: #fbbf24; font-weight: 500; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 8px; font-weight: 500; }
        .input-control { width: 100%; background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: #ffffff; font-size: 15px; box-sizing: border-box; outline: none; }
        .input-control:focus { border-color: #f97316; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn-choice { border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(30, 35, 50, 0.6); color: #e2e8f0; padding: 12px 8px; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; box-sizing: border-box; }
        .btn-choice.active { background: #f97316; border-color: #f97316; color: #ffffff; font-weight: bold; box-shadow: 0 0 12px rgba(249, 115, 22, 0.4); }
        .link-btn { background: none; border: none; color: #f97316; font-size: 12px; cursor: pointer; padding: 0; }
        .hidden { display: none; }
        .mt-2 { margin-top: 8px; }
        .divider { border-top: 1px solid #1e293b; margin: 20px 0; padding-top: 16px; }
        .btn-submit { width: 100%; background: linear-gradient(90deg, #f97316, #f59e0b); color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2); }
    </style>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <div class="container">
        <div class="top-bar"></div>
        <div class="header">
            <h1>Swag Walking Bar</h1>
            <p>高雄市鳳山區中山西路46號</p>
            <p class="subway">捷運鳳山站 2 號出口</p>
        </div>
        <form id="bookingForm">
            <div class="form-group">
                <label>1. 選擇人數</label>
                <select id="guests" class="input-control">
                    <option value="1">1 人</option>
                    <option value="2" selected>2 人</option>
                    <option value="3">3 人</option>
                    <option value="4">4 人</option>
                    <option value="5">5 人</option>
                    <option value="6">6 人</option>
                </select>
            </div>
            <div class="form-group">
                <label>2. 選擇日期</label>
                <input type="date" id="date" required class="input-control">
            </div>
            <div class="form-group">
                <label>3. 選擇區域</label>
                <div class="grid-2">
                    <button type="button" id="area-bar" class="btn-choice active">1樓吧台區</button>
                    <button type="button" id="area-camp" class="btn-choice">2樓露營區</button>
                </div>
            </div>
            <div class="form-group">
                <label>4. 選擇時間</label>
                <div class="grid-4">
                    <button type="button" class="time-btn btn-choice">18:00</button>
                    <button type="button" class="time-btn btn-choice">19:00</button>
                    <button type="button" class="time-btn btn-choice">20:00</button>
                    <button type="button" class="time-btn btn-choice">21:00</button>
                </div>
                <button type="button" id="btnCustom" class="link-btn">自行填寫其他時間</button>
                <input type="time" id="customTime" class="input-control hidden mt-2">
            </div>
            <div class="divider">
                <div class="form-group">
                    <label>顧客姓名</label>
                    <input type="text" id="name" required placeholder="請輸入您的姓名" class="input-control">
                </div>
                <div class="form-group">
                    <label>電話號碼</label>
                    <input type="tel" id="phone" required placeholder="請輸入聯絡電話" class="input-control">
                </div>
                <div class="form-group">
                    <label>備註說明 (選填)</label>
                    <textarea id="notes" placeholder="如有需求請註明" rows="2" class="input-control"></textarea>
                </div>
            </div>
            <button type="submit" class="btn-submit">確認預約訂位</button>
        </form>
    </div>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBDo8F-FeoSnY-DOA3YemmahvPmcVnoxGY",
          authDomain: "://firebaseapp.com",
          databaseURL: "https://firebaseio.com",
          projectId: "swag-walking-bar",
          storageBucket: "swag-walking-bar.firebasestorage.app",
          messagingSenderId: "667221676731",
          appId: "1:667221676731:web:28201b76875fe9c79b8f9e"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let selectedArea = '1樓吧台區';
        let selectedTime = '';

        document.getElementById('date').min = new Date().toISOString().split('T')[0];

        // 綁定區域按鈕事件
        document.getElementById('area-bar').addEventListener('click', function() {
            selectedArea = '1樓吧台區';
            this.classList.add('active');
            document.getElementById('area-camp').classList.remove('active');
        });
        document.getElementById('area-camp').addEventListener('click', function() {
            selectedArea = '2樓露營區';
            this.classList.add('active');
            document.getElementById('area-bar').classList.remove('active');
        });

        // 綁定預設時間按鈕事件
        const timeBtns = document.querySelectorAll('.time-btn');
        timeBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.getElementById('customTime').classList.add('hidden');
                timeBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                selectedTime = this.innerText;
            });
        });

        // 綁定自訂時間切換
        document.getElementById('btnCustom').addEventListener('click', function() {
            selectedTime = '';
            timeBtns.forEach(function(b) { b.classList.remove('active'); });
            const customInput = document.getElementById('customTime');
            customInput.classList.remove('hidden');
            customInput.focus();
        });

        // 提交預約表單
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const finalTime = selectedTime || document.getElementById('customTime').value;
            if(!finalTime) { alert('請選擇或填寫訂位時間！'); return; }

            const bookingData = {
                guests: document.getElementById('guests').value,
                date: document.getElementById('date').value,
                area: selectedArea,
                time: finalTime,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                notes: document.getElementById('notes').value,
                createdAt: new Date().toISOString()
            };

            database.ref('bookings').push(bookingData)
                .then(function() {
                    alert('🎉 預約成功！期待您的光臨！');
                    document.getElementById('bookingForm').reset();
                    timeBtns.forEach(function(b) { b.classList.remove('active'); });
                    selectedTime = '';
                    selectedArea = '1樓吧台區';
                    document.getElementById('area-bar').classList.add('active');
                    document.getElementById('area-camp').classList.remove('active');
                })
                .catch(function(error) { alert('連線失敗：' + error.message); });
        });
    </script>
</body>
</html>
