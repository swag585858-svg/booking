<!DOCTYPE html>
<!-- saved from url=(0042)file:///C:/Users/user/Downloads/index.html -->
<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Walking Bar - 線上訂位系統</title>
    <link href="file:///C:/Users/user/Downloads/index_files/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161d30;
            --primary: #f2a154;
            --primary-hover: #e08e3d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2e3b5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 20px 10px; }
        .container { max-width: 480px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border); }
        .header { padding: 24px; text-align: center; background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid var(--border); }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--primary); letter-spacing: 1px; margin-bottom: 8px; }
        .info-box { font-size: 13px; color: var(--text-muted); background: rgba(242, 161, 84, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(242, 161, 84, 0.2); margin-top: 10px; display: inline-block; width: 100%; text-align: left; }
        .info-box p { margin-bottom: 4px; }
        .info-box p:last-child { margin-bottom: 0; }
        .form-section { padding: 20px; border-bottom: 1px solid var(--border); }
        .section-title { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--primary); }
        .grid-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .btn-opt { background: #1e2942; border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: var(--text-main); cursor: pointer; text-align: center; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
        .btn-opt:hover { border-color: var(--primary); }
        .btn-opt.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; background: #1e2942; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); }
        .hidden { display: none !important; }
        .btn-submit { display: block; width: 100%; background: var(--primary); color: #000; text-align: center; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
        .btn-submit:hover { background: var(--primary-hover); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-content { background: var(--card-bg); border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; text-align: center; border: 1px solid var(--border); }
        .success-icon { font-size: 48px; color: #10b981; margin-bottom: 16px; }
        .btn-modal-close { background: var(--primary); color: #000; border: none; padding: 10px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-text">Swag Walking Bar</div>
            <div class="info-box">
                <p><i class="fas fa-map-marker-alt"></i> 高雄市鳳山區中山西路46號</p>
                <p><i class="fas fa-subway"></i> 捷運鳳山站 2 號出口</p>
                <p><i class="fas fa-exclamation-triangle"></i> 未滿 18 歲請勿飲酒 | 酒後不開車</p>
            </div>
        </div>

        <form id="bookingForm">
            <!-- 1. 人數 -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-users"></i> 1. 選擇人數</div>
                <div class="grid-options" id="guestContainer">
                    <div class="btn-opt active" data-value="1-2人">1-2 人</div>
                    <div class="btn-opt" data-value="3-4人">3-4 人</div>
                    <div class="btn-opt" data-value="5-6人">5-6 人</div>
                    <div class="btn-opt" data-value="大型聚會(請備註)">6人以上</div>
                </div>
            </div>

            <!-- 2. 日期 -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-calendar-day"></i> 2. 選擇日期</div>
                <div class="grid-options" id="dateContainer">
                    <!-- Javascript will fill dynamic dates -->
                <div class="btn-opt active" data-value="2026-10-29"><span style="display:block; font-size:12px;">今天</span>10/29</div><div class="btn-opt " data-value="2026-10-30"><span style="display:block; font-size:12px;">明天</span>10/30</div><div class="btn-opt " data-value="2026-10-31"><span style="display:block; font-size:12px;">週六</span>10/31</div><div class="btn-opt " data-value="2026-11-01"><span style="display:block; font-size:12px;">週日</span>11/1</div><div class="btn-opt active" data-value="2026-10-29"><span style="display:block; font-size:12px;">今天</span>10/29</div><div class="btn-opt " data-value="2026-10-30"><span style="display:block; font-size:12px;">明天</span>10/30</div><div class="btn-opt " data-value="2026-10-31"><span style="display:block; font-size:12px;">週六</span>10/31</div><div class="btn-opt " data-value="2026-11-01"><span style="display:block; font-size:12px;">週日</span>11/1</div></div>
            </div>

            <!-- 3. 區域 -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-layer-group"></i> 3. 選擇座位區域</div>
                <div class="grid-options" id="areaContainer">
                    <div class="btn-opt active" data-value="1樓吧台區">1樓吧台區</div>
                    <div class="btn-opt" data-value="2樓露營區">2樓露營區</div>
                </div>
            </div>

            <!-- 4. 時段 -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-clock"></i> 4. 選擇用餐時段</div>
                <div class="grid-options grid-4" id="timeContainer">
                    <div class="btn-opt active" data-value="18:00">18:00</div>
                    <div class="btn-opt" data-value="19:00">19:00</div>
                    <div class="btn-opt" data-value="20:00">20:00</div>
                    <div class="btn-opt" data-value="21:00">21:00</div>
                </div>
                <div style="margin-top: 12px;">
                    <div class="btn-opt" id="btnCustomTime" style="font-size: 13px;"><i class="fas fa-edit"></i> 自行填寫其他時間</div>
                    <div id="customTimeGroup" class="input-group hidden" style="margin-top: 10px;">
                        <input type="time" id="customTimeInput" class="form-control" placeholder="請輸入時間">
                    </div>
                </div>
            </div>

            <!-- 5. 客戶資料 -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-user-edit"></i> 5. 填寫聯繫資料</div>
                <div class="input-group">
                    <label>訂位人姓名 *</label>
                    <input type="text" id="custName" class="form-control" required="" placeholder="請輸入姓名">
                </div>
                <div class="input-group">
                    <label>手機號碼 *</label>
                    <input type="tel" id="custPhone" class="form-control" required="" placeholder="請輸入手機號碼">
                </div>
                <div class="input-group">
                    <label>特殊需求備註</label>
                    <textarea id="custNotes" class="form-control" rows="2" placeholder="過敏原、慶生等特殊需求..."></textarea>
                </div>

                <button type="submit" class="btn-submit">確認預約訂位</button>
            </div>
        </form>
    </div>

    <!-- 成功彈窗 -->
    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h3 style="margin-bottom: 10px;">訂位成功！</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;" id="modalSummary"></p>
            <p style="color: var(--primary); font-size: 13px;">期待您的光臨，請準時出席。</p>
            <button class="btn-modal-close" id="btnCloseModal">好的</button>
        </div>
    </div>

    <script>
        // 初始化日期選項
        const dateContainer = document.getElementById('dateContainer');
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        let selectedDate = '';

        for (let i = 0; i < 4; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
            const fullDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const dayName = i === 0 ? '今天' : i === 1 ? '明天' : `週${days[d.getDay()]}`;
            
            const btn = document.createElement('div');
            btn.className = `btn-opt ${i === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span style="display:block; font-size:12px;">${dayName}</span>${dateStr}`;
            btn.setAttribute('data-value', fullDateStr);
            if (i === 0) selectedDate = fullDateStr;

            btn.addEventListener('click', function() {
                document.querySelectorAll('#dateContainer .btn-opt').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedDate = this.getAttribute('data-value');
            });
            dateContainer.appendChild(btn);
        }

        // 通用單選按鈕組處理
        function setupRadioGroup(containerId, callback) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.btn-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (callback) callback(this.getAttribute('data-value'));
                });
            });
        }

        setupRadioGroup('guestContainer');
        setupRadioGroup('areaContainer');
        setupRadioGroup('timeContainer', () => {
            // 如果點選了預設時段，把自訂時段關閉並清空
            document.getElementById('customTimeGroup').classList.add('hidden');
            document.getElementById('btnCustomTime').classList.remove('active');
            document.getElementById('customTimeInput').value = '';
        });

        // 自訂時間點擊
        const btnCustomTime = document.getElementById('btnCustomTime');
        const customTimeGroup = document.getElementById('customTimeGroup');
        const customTimeInput = document.getElementById('customTimeInput');

        btnCustomTime.addEventListener('click', function() {
            document.querySelectorAll('#timeContainer .btn-opt').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            customTimeGroup.classList.remove('hidden');
            customTimeInput.focus();
        });

        customTimeInput.addEventListener('input', function() {
            if(this.value) {
                btnCustomTime.setAttribute('data-value', this.value);
            }
        });

        // 提交表單
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const guests = document.querySelector('#guestContainer .btn-opt.active').getAttribute('data-value');
            const area = document.querySelector('#areaContainer .btn-opt.active').getAttribute('data-value');
            
            let time = '';
            const activeTimeBtn = document.querySelector('#timeContainer .btn-opt.active');
            if (activeTimeBtn) {
                time = activeTimeBtn.getAttribute('data-value');
            } else if (btnCustomTime.classList.contains('active')) {
                time = customTimeInput.value || '未填寫';
            }

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const notes = document.getElementById('custNotes').value;

            const newBooking = {
                id: 'SW' + Date.now().toString().slice(-4),
                name: name,
                phone: phone,
                date: selectedDate,
                time: time,
                guests: guests,
                area: area,
                notes: notes,
                status: '已確認',
                createdAt: new Date().toLocaleTimeString()
            };

            // 儲存至 localStorage 供跨網頁共享測試
            let currentBookings = JSON.parse(localStorage.getItem('swag_bookings')) || [];
            currentBookings.push(newBooking);
            localStorage.setItem('swag_bookings', JSON.stringify(currentBookings));

            // 顯示成功彈窗
            document.getElementById('modalSummary').innerText = `${selectedDate} ${time} | ${area} | ${guests}`;
            document.getElementById('successModal').classList.remove('hidden');
        });

        // 關閉彈窗重置
        document.getElementById('btnCloseModal').addEventListener('click', function() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('bookingForm').reset();
            // 重置自訂按鈕
            customTimeGroup.classList.add('hidden');
            btnCustomTime.classList.remove('active');
            // 回到預設第一個日期跟時段
            document.querySelectorAll('#dateContainer .btn-opt').forEach((b, idx) => {
                if(idx===0) b.classList.add('active'); else b.classList.remove('active');
            });
            document.querySelectorAll('#timeContainer .btn-opt').forEach((b, idx) => {
                if(idx===0) b.classList.add('active'); else b.classList.remove('active');
            });
        });
    </script>


</body></html>
